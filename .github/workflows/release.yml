name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag version (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine release branch
        id: branch
        run: |
          if [[ "${{ inputs.version }}" == v1.* ]]; then
            echo "name=1.x" >> $GITHUB_OUTPUT
          else
            echo "name=main" >> $GITHUB_OUTPUT
          fi

      - name: Checkout release branch
        run: git checkout ${{ steps.branch.outputs.name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Update unreleased changelog
        run: php bin/update-changelog.php

      - name: Finalize release changelog
        run: php bin/release-changelog.php ${{ inputs.version }}

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: update changelog for ${{ inputs.version }}"
          git push

      - name: Push tag & create release on monorepo
        env:
          GH_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/dapodik-org/dapodik-laravel.git"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --repo dapodik-org/dapodik-laravel \
            --title "$VERSION" --notes-file /tmp/release-body.md

      - name: Tag sub-packages
        env:
          GH_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$VERSION" == v1.* ]]; then
            SUB_BRANCH="1.x"
          else
            SUB_BRANCH="main"
          fi

          declare -A DIR_MAP
          DIR_MAP["dapodik-laravel-eloquent"]="src/laravel/Eloquent"
          DIR_MAP["dapodik-laravel-api"]="src/laravel/API"

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          for REPO in "${!DIR_MAP[@]}"; do
            SRC_DIR="${DIR_MAP[$REPO]}"
            TARGET="dapodik-org/${REPO}"

            if [ -n "$LAST_TAG" ]; then
              CHANGES=$(git diff --name-only "$LAST_TAG" HEAD -- "$SRC_DIR" 2>/dev/null)
              if [ -z "$CHANGES" ]; then
                echo "==> No changes in $SRC_DIR since $LAST_TAG — skipping $REPO"
                continue
              fi
            fi

            echo "==> Tagging $TARGET on branch $SUB_BRANCH"

            TMP_DIR=$(mktemp -d)
            git clone "https://x-access-token:${GH_TOKEN}@github.com/${TARGET}.git" "$TMP_DIR"
            cd "$TMP_DIR"
            git checkout "$SUB_BRANCH"
            git tag "$VERSION"
            git push origin "$VERSION"
            cd "$OLDPWD"
            rm -rf "$TMP_DIR"

            echo "==> Creating release on $TARGET"
            gh release create "$VERSION" --repo "$TARGET" --title "$VERSION" --generate-notes
          done
