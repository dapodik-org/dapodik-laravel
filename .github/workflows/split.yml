name: Monorepo Split

on:
  push:
    branches: [main]
    tags: ['*']

env:
  GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - local_path: src/laravel/Eloquent
            split_repository: dapodik-laravel-eloquent
          - local_path: src/laravel/API
            split_repository: dapodik-laravel-api

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Initialize target repo if empty
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          REPO_URL="https://${{ secrets.SPLIT_TOKEN }}@github.com/dapodik-org/${{ matrix.package.split_repository }}.git"
          if [ -z "$(git ls-remote "$REPO_URL" HEAD)" ]; then
            rm -rf /tmp/init-repo
            git init /tmp/init-repo
            cd /tmp/init-repo
            git checkout -b main
            echo "# ${{ matrix.package.split_repository }}" > README.md
            git add README.md
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git commit -m "Initial commit"
            git remote add origin "https://${{ secrets.SPLIT_TOKEN }}@github.com/dapodik-org/${{ matrix.package.split_repository }}.git"
            git push origin main
            cd /github/workspace
          fi

      - if: "!startsWith(github.ref, 'refs/tags/')"
        uses: danharrin/monorepo-split-github-action@v2.4.5
        with:
          package_directory: ${{ matrix.package.local_path }}
          repository_organization: dapodik-org
          repository_name: ${{ matrix.package.split_repository }}

      - if: startsWith(github.ref, 'refs/tags/')
        uses: danharrin/monorepo-split-github-action@v2.4.5
        with:
          tag: ${{ github.ref_name }}
          package_directory: ${{ matrix.package.local_path }}
          repository_organization: dapodik-org
          repository_name: ${{ matrix.package.split_repository }}
